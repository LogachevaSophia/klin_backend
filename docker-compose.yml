version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: klin_backend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/klin_backend
      CORS_ORIGINS: '["*"]'
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"

volumes:
  pgdata:
